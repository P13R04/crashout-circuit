<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crashout Circuit — Table</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #030611; overflow: hidden; }
    canvas { display: block; touch-action: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    [hidden] { display: none !important; }
    #status {
      position: fixed; top: var(--table-top, 18px); left: 50%; transform: translateX(-50%);
      padding: 10px 18px; border: 1px solid #ffbe37; border-radius: 20px;
      color: #ffdf9a; background: #080f26f5; font: 14px system-ui; pointer-events: none;
    }
    #pc-tools { position: fixed; top: var(--tools-y, 35px); left: var(--tools-x, 55%); width:var(--tools-w,110px); height:var(--tools-h,76px); font: 13px system-ui; color: #d8e1f0; }
    summary {
      width: 100%; height:100%; margin: auto; padding: 0; justify-content:center; border: 1px solid #64748b;
      border-radius: 20px; background: #080f26ee; cursor: pointer; list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary { display: flex; align-items: center; gap: 8px; min-height: 0; }
    summary svg { color: #8ee7ec; width:calc(32px * var(--tools-scale,1)); height:calc(32px * var(--tools-scale,1)); }
    .tools-content {
      position: absolute; top: 50%; left: calc(100% + 10px); transform: translateY(-50%); max-height:calc(100vh - 24px); overflow-y:auto;
      width: min(400px, calc(100vw - 32px)); padding: 16px; background: #080f26f5;
      border: 1px solid #64748b; border-radius: 18px; box-shadow: 0 8px 30px #0008;
    }
    #settings-home { width:100%; margin-bottom:14px; }
    #fullscreen { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-bottom: 14px; }
    #fullscreen-notice { color: #ffca8b; font-size: 12px; margin-bottom: 10px; }
    #drive-options { margin-bottom:14px; }
    #drive-A { border-color:#00e5ff; } #drive-B { border-color:#ff4081; }
    #race-options { margin:14px 0; padding-top:12px; border-top:1px solid #ffffff18; }
    #race-options label { display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0; }
    #race-options input[type=number] { width:62px; }
    #race-options input,#race-options select { font:inherit; background:#122044; color:#fff;border:1px solid #64748b;border-radius:6px;padding:7px; }
    #race-options input[type=checkbox] { width:18px;height:18px;vertical-align:middle; }
    #race-options :disabled { opacity:.4; }
    .setting-label { font-size: 12px; color: #b9cbd0; margin-bottom: 10px; }
    #theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .theme-option { padding: 12px; text-align: left; background: #101b26; }
    .theme-option[aria-pressed="true"] { border-color: #9becf2; box-shadow: inset 0 0 0 1px #9becf2; background: #223a44; }
    .theme-swatch { display: flex; gap: 5px; margin-bottom: 10px; }
    .theme-swatch i { display: block; width: 23px; height: 12px; border-radius: 3px; border: 1px solid #ffffff25; }
    .theme-option strong, .theme-option small { display: block; }
    .theme-option small { color: #b4c8ce; font-size: 11px; margin-top: 4px; }
    #sim.on { border-top: 1px solid #ffffff18; margin-top: 14px; padding-top: 12px; }
    body[data-theme="scrap"] .tools-content, body[data-theme="scrap"] summary { background: #162329f5; border-color: #758c91; }
    #sim, #testbar { display: none; flex-wrap: wrap; gap: 8px; }
    #sim.on, #testbar.on { display: flex; }
    #testbar.on { border-top: 1px solid #ffffff18; margin-top: 12px; padding-top: 12px; }
    button {
      flex: 1; padding: 10px 14px; border: 1px solid #64748b; border-radius: 10px;
      background: #122044; color: #fff; font: inherit; cursor: pointer; min-height: 42px;
    }
    button:hover { border-color: #00e5ff; }
    button.armed { background: #00e5ff; color: #04081f; }
    button.active { border-color: #ffbe37; background: #553a12; }
    button.active::before { content: '✓ '; color: #ffbe37; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #sim-hint { width: 100%; color: #b7c2da; font-size: 12px; line-height: 1.5; }
    #sim-hint:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Table de jeu Crashout Circuit"></canvas>
  <details id="pc-tools">
    <summary title="Paramètres" aria-label="Paramètres"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/></svg></summary>
    <div class="tools-content">
      <button type="button" id="fullscreen" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg><span>Plein écran</span></button>
      <button type="button" id="settings-home">⌂ Accueil</button>
      <p id="fullscreen-notice" role="status" hidden></p>
      <div id="drive-options" role="group" aria-label="Conduite" hidden>
        <p class="setting-label">Conduite</p>
        <button id="drive-A" aria-label="Conduite cyan" aria-pressed="false">Cyan · AUTO</button>
        <button id="drive-B" aria-label="Conduite rose" aria-pressed="false">Rose · AUTO</button>
      </div>
      <div id="race-options" role="group" aria-label="Course">
        <p class="setting-label">Course</p>
        <label>Difficulté <select id="race-difficulty"><option value="easy">Easy · 50 %</option><option value="medium">Medium · 75 %</option><option value="hard">Hard · 100 %</option></select></label>
        <label>Tours <input id="race-laps" type="number" min="1" max="99" step="1" value="3" /></label>
        <label><span><input id="race-timer" type="checkbox" /> Chronomètre</span><span><input id="race-minutes" aria-label="Durée en minutes" type="number" min="0.5" max="120" step="0.5" value="2" disabled /> min</span></label>
      </div>
      <p class="setting-label">Ambiance</p>
      <div id="theme-options" role="group" aria-label="Thème visuel"></div>
      <div id="sim" role="group" aria-label="Simuler un geste">
        <button id="sim3" aria-label="Lance-pierre" aria-pressed="false" title="Maintenir le clic, tirer et relâcher">Lance-pierre</button>
        <button id="sim2" aria-label="Boost" aria-pressed="false" title="Placer les deux contacts du boost par deux clics">Boost</button>
        <span id="sim-hint" role="status"></span>
      </div>
      <div id="testbar" role="group" aria-label="Options de test PC">
        <button id="test-invincible" aria-label="Invincibles" aria-pressed="false" title="Rendre les deux véhicules invincibles">Invincibles</button>
        <button id="test-items" aria-label="Objets libres" aria-pressed="false" title="Utiliser les deux gestes sans limite de stock">Objets libres</button>
      </div>
    </div>
  </details>
  <div id="status" role="status">Connexion…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
