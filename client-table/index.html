<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crashout Circuit — Table</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #04081f;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none; /* required for Pointer Events */
    }
    #status {
      position: fixed;
      top: 44px; left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-family: monospace;
      font-size: 13px;
      pointer-events: none;
    }
    #sim {
      position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; align-items: center;
      font: 13px monospace; color: #cfd8e3;
    }
    #sim.on { display: flex; }
    #sim button {
      background: #12204a; color: #fff; border: 1px solid #00e5ff; border-radius: 6px;
      padding: 8px 12px; font: inherit; cursor: pointer;
    }
    #sim button:hover { background: #1b3270; }
    #sim button.armed { background: #00e5ff; color: #04081f; }
    #testbar {
      position: fixed; bottom: 52px; left: 54%; transform: translateX(-50%);
      display: none; gap: 8px; align-items: center;
      font: 12px monospace; color: #ffd08a;
    }
    #testbar.on { display: flex; }
    #testbar button {
      background: #3a2406; color: #fff; border: 1px solid #ff9c2e; border-radius: 6px;
      padding: 7px 12px; font: inherit; cursor: pointer;
    }
    #testbar button:hover { background: #55330a; }
    #testbar button.active { background: #ff9c2e; color: #1a0f00; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="testbar">
    <span>TEST (PC)</span>
    <button id="test-invincible">🛡 Véhicules invincibles</button>
    <button id="test-items">🎁 Tous les objets utilisables</button>
  </div>
  <div id="sim">
    <button id="sim3">🏹 Simuler lance-pierre (clic + tirer + relâcher)</button>
    <button id="sim2">✌ Simuler 2 doigts (boost)</button>
    <span id="sim-hint"></span>
  </div>
  <div id="status">Connexion…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
