<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crashout Circuit — Console Oz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090f1d;
      color: #e2e8f0;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 48px;
      padding: 0 20px;
      background: #0e172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .06em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span {
      color: #64748b;
      font-weight: 400;
      font-size: 13px;
    }
    #status {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status.online {
      color: #34d399;
    }
    #status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    
    #toolbar {
      padding: 10px 20px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .tool-btn:hover:not(:disabled) {
      background: #2d3b55;
      border-color: #64748b;
    }
    .tool-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .tool-btn#btn-arc {
      border-color: #d97706;
    }
    .tool-btn#btn-arc:hover:not(:disabled) {
      background: #3c2415;
      border-color: #f59e0b;
    }
    .tool-btn#btn-arc.active {
      background: #78350f;
      border-color: #fbbf24;
      color: #fef3c7;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
    }
    .tool-btn#btn-wall {
      border-color: #dc2626;
    }
    .tool-btn#btn-wall:hover:not(:disabled) {
      background: #3b181e;
      border-color: #ef4444;
    }
    .tool-btn#btn-wall.active {
      background: #7f1d1d;
      border-color: #f87171;
      color: #fee2e2;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
    }
    .clear-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .clear-btn:hover:not(:disabled) {
      background: #334155;
      color: #f87171;
      border-color: #ef4444;
    }
    #hint {
      margin-left: 12px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #map-container {
      flex: 1;
      position: relative;
      background: #04081f;
      min-height: 0;
      overflow: hidden;
    }
    #toolbar { flex-wrap: wrap; gap: 8px; }
    #placement-mode { background:#172638; color:#e2e8f0; border:1px solid #475569; border-radius:8px; padding:10px; font:inherit; }
    #touch-tools { display:flex; gap:8px; }
    #touch-tools[hidden], [hidden] { display:none !important; }
    #touch-tools .active { border-color:#67e8f9; background:#164e63; }
    #touch-cancel { padding:8px 12px; }
    @media(max-width:900px) { #hint { flex-basis:100%; margin-left:0; } .tool-btn { padding:8px 12px; } }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>CRASHOUT <span>· Console Magicien d’Oz</span></h1>
    <span id="status">Connexion…</span>
  </header>
  <div id="toolbar">
    <select id="placement-mode" aria-label="Mode de placement des tangibles">
      <option value="manual">Placement manuel</option>
      <option value="touch">Pose tactile</option>
    </select>
    <div id="touch-tools" hidden>
      <button type="button" class="tool-btn" data-tangible="1" aria-keyshortcuts="m">▰ Mur · M</button>
      <button type="button" class="tool-btn" data-tangible="2" aria-keyshortcuts="1">⚡ Pilier 1 · 1</button>
      <button type="button" class="tool-btn" data-tangible="3" aria-keyshortcuts="2">⚡ Pilier 2 · 2</button>
      <button type="button" class="tool-btn" id="touch-cancel" hidden>Annuler</button>
    </div>
    <button type="button" id="btn-arc" class="tool-btn">⚡ Arc électrique</button>
    <button type="button" id="btn-wall" class="tool-btn">🧱 Mur</button>
    <span id="hint">Cliquez sur un bouton, puis 2 fois sur la carte pour placer l'obstacle</span>
    <button type="button" id="btn-clear" class="clear-btn">🗑 Retirer les obstacles</button>
  </div>
  <div id="map-container">
    <canvas id="oz-map" width="1920" height="1080"></canvas>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
