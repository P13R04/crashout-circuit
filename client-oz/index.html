<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crashout Circuit — Tangibles Oz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #090f1d; color: #e2e8f0; font: 14px system-ui, sans-serif; }
    header { padding: 18px 24px; border-bottom: 1px solid #253149; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { font-size: 17px; margin: 0; } h2 { font-size: 14px; margin: 0 0 14px; }
    #status { font-size: 12px; color: #94a3b8; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; padding: 20px 24px; align-items: start; }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #04081f; border: 1px solid #34435e; border-radius: 12px; touch-action: none; }
    p { color: #9eacc1; line-height: 1.55; margin: 12px 0 0; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    section { background: #101a2b; border: 1px solid #253149; border-radius: 12px; padding: 16px; }
    button, select { font: inherit; background: #1d2c43; color: #e2e8f0; border: 1px solid #42526d; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
    button:hover { background: #2c405d; } button:disabled, select:disabled { opacity: .45; cursor: default; }
    button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid #ffe14a; outline-offset: 3px; }
    #tangible-list { display: grid; gap: 8px; margin-bottom: 22px; }
    #tangible-list button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
    #tangible-list .selected { border-color: #ffe14a; background: #293449; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #667085; flex-shrink: 0; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 9px #3ddc8444; }
    label { display: block; color: #a9b7cd; font-size: 12px; margin-top: 14px; }
    select { display: block; width: 100%; margin-top: 6px; }
    #activation { width: 100%; margin-top: 20px; font-weight: 600; border-color: #3ddc84; }
    #activation[aria-pressed="true"] { background: #175039; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button { flex: 1; font-size: 12px; padding: 9px 6px; }
    #notice { font-size: 12px; color: #ffe14a; min-height: 20px; }
    @media(max-width: 850px) { main { grid-template-columns: 1fr; padding: 14px; } #tangible-list { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header><h1>CRASHOUT · Tangibles Oz</h1><span id="status" role="status">Connexion…</span></header>
  <main>
    <div>
      <canvas id="oz-map" width="1920" height="1080" tabindex="0" aria-label="Circuit et zones copilote. Sélectionner un tangible pour le placer ou le déplacer. Poignée 2 pour tourner le mur autour de la poignée 1."></canvas>
      <p id="hint">Clic : placer · glisser : déplacer · poignée 2 : tourner autour de 1.</p>
      <p id="notice" role="status" aria-live="polite"></p>
    </div>
    <fieldset id="controls" disabled>
      <section>
        <h2>Tangibles</h2>
        <div id="tangible-list" role="group" aria-label="Tangible sélectionné"></div>
        <label for="kind">Type</label><select id="kind"><option value="wall">Mur</option><option value="pylon">Pilier électrique</option></select>
        <label for="team">Équipe</label><select id="team"><option value="A">Cyan</option><option value="B">Rose</option></select>
        <button id="activation" aria-pressed="false">Activer</button>
        <div class="actions"><button id="dock">Zone copilote</button><button id="remove">Retirer</button></div>
      </section>
    </fieldset>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
